baseURL = 'https://kurabebako.com/'
title = 'kurabebako'

locale = 'ja-jp'
defaultContentLanguage = 'ja'

enableRobotsTXT = true

# 記事の日付は front matter で決める。git の更新日時は使わない
# （文言修正のコミットで「最終確認日」が動いてしまうため）。
# lastmod を書かない記事は date が最終確認日になる
[frontmatter]
  lastmod = ['lastmod', 'date']

[pagination]
  pagerSize = 20

# テーマは Hugo Modules で管理する（git submodule は使わない）。
# 更新は `npm run mod:update`（= hugo mod get -u ./... && hugo mod tidy）。
[module]
  [[module.imports]]
    path = 'github.com/adityatelange/hugo-PaperMod'

[markup.goldmark.renderer]
  unsafe = true

# Markdown の行の途中の改行は、HTML では空白 1 文字として描かれる。
# 日本語は語の間に空白を置かないので「ファイルへの リクエスト」のように語の途中が割れて見える。
# 全角文字どうしの間の改行だけを消す（英単語の間の改行は空白のまま残る）。
# 記事側で 1 文を 1 行に詰め直さなくて済むように、設定で直す
[markup.goldmark.extensions.cjk]
  enable = true
  eastAsianLineBreaks = true
  eastAsianLineBreaksStyle = 'css3draft'

[outputs]
  home = ['html', 'rss']

[params]
  env = 'production'
  description = 'AIツール・開発環境・CLI・SaaS・サーバーの比較まとめ'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowToc = true
  # 比較記事は節を行き来するので、目次は開いた状態で始める
  TocOpen = true
  ShowCodeCopyButtons = true

  # トップの冒頭に「何を、どう比べるサイトか」を出す。
  # 記事一覧だけだと About まで読まないと趣旨が伝わらないため。Content は Markdown
  [params.homeInfoParams]
    Title = '技術サービスを、同じ物差しで比べる'
    Content = '''
AI ツール・開発環境・CLI・SaaS・サーバーの料金・仕様・制約を、公式の一次情報と実行結果から比較します。

- 出典は公式の料金ページ・ドキュメントのみ。まとめ記事や SNS は使いません
- AI が実際に動かして確認した「実行」と、文書で確認しただけの「仕様」を区別します
- 記事ごとに最終確認日を載せます。料金は改定されるので、日付を見てから判断してください
'''

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = '比較記事'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'about'
    name = 'このサイトについて'
    url = '/about/'
    weight = 20
  [[menu.main]]
    identifier = 'privacy'
    name = 'プライバシーポリシー'
    url = '/privacy/'
    weight = 30
  [[menu.main]]
    identifier = 'contact'
    name = 'お問い合わせ'
    url = '/contact/'
    weight = 40
