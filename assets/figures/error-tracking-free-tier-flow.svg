<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 730" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14" fill="currentColor">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect x="20" y="20" width="300" height="64" rx="8"/>
    <rect x="20" y="150" width="300" height="64" rx="8"/>
    <rect x="20" y="280" width="300" height="64" rx="8"/>
    <rect x="20" y="410" width="300" height="64" rx="8"/>
    <rect x="20" y="540" width="300" height="64" rx="8"/>
    <rect x="420" y="20" width="320" height="64" rx="8" opacity="0.9"/>
    <rect x="420" y="150" width="320" height="64" rx="8" opacity="0.9"/>
    <rect x="420" y="280" width="320" height="64" rx="8" opacity="0.9"/>
    <rect x="420" y="410" width="320" height="64" rx="8" opacity="0.9"/>
    <rect x="420" y="540" width="320" height="64" rx="8" opacity="0.9"/>
    <rect x="20" y="660" width="720" height="50" rx="8" opacity="0.9"/>
    <line x1="320" y1="52" x2="418" y2="52" marker-end="url(#arrow)"/>
    <line x1="320" y1="182" x2="418" y2="182" marker-end="url(#arrow)"/>
    <line x1="320" y1="312" x2="418" y2="312" marker-end="url(#arrow)"/>
    <line x1="320" y1="442" x2="418" y2="442" marker-end="url(#arrow)"/>
    <line x1="320" y1="572" x2="418" y2="572" marker-end="url(#arrow)"/>
    <line x1="170" y1="84" x2="170" y2="148" marker-end="url(#arrow)"/>
    <line x1="170" y1="214" x2="170" y2="278" marker-end="url(#arrow)"/>
    <line x1="170" y1="344" x2="170" y2="408" marker-end="url(#arrow)"/>
    <line x1="170" y1="474" x2="170" y2="538" marker-end="url(#arrow)"/>
    <line x1="170" y1="604" x2="170" y2="658" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" opacity="0.75">
    <text x="360" y="46" text-anchor="middle">はい</text>
    <text x="360" y="176" text-anchor="middle">はい</text>
    <text x="360" y="306" text-anchor="middle">はい</text>
    <text x="360" y="436" text-anchor="middle">はい</text>
    <text x="360" y="566" text-anchor="middle">はい</text>
    <text x="182" y="120">いいえ</text>
    <text x="182" y="250">いいえ</text>
    <text x="182" y="380">いいえ</text>
    <text x="182" y="510">いいえ</text>
    <text x="182" y="636">いいえ</text>
  </g>
  <g text-anchor="middle">
    <text x="170" y="46">エラーのデータを</text>
    <text x="170" y="68">自分のサーバーに置きたい</text>
    <text x="170" y="176">無料で受けられる量を優先し、</text>
    <text x="170" y="198">Sentry SDK のまま送り先を替えたい</text>
    <text x="170" y="306">無料のまま複数人で</text>
    <text x="170" y="328">同じエラーを見たい</text>
    <text x="170" y="436">1 人で、トレースや</text>
    <text x="170" y="458">セッションの記録も試したい</text>
    <text x="170" y="566">1 人で、死活監視と</text>
    <text x="170" y="588">ステータスページもまとめたい</text>
  </g>
  <g text-anchor="middle">
    <text x="580" y="46" font-weight="600">GlitchTip（セルフホスト）</text>
    <text x="580" y="68" font-size="12">オープンソース。Sentry SDK をそのまま使える</text>
    <text x="580" y="176" font-weight="600">Better Stack Errors（Free）</text>
    <text x="580" y="198" font-size="12">無料の件数が桁違い。受信を読む API は無い</text>
    <text x="580" y="306" font-weight="600">Rollbar（Free）</text>
    <text x="580" y="328" font-size="12">人数無制限。自社 SDK か REST API で送る</text>
    <text x="580" y="436" font-weight="600">Sentry（Developer）</text>
    <text x="580" y="458" font-size="12">エラー以外の枠も付く。無料は 1 人</text>
    <text x="580" y="566" font-weight="600">Honeybadger（Developer）</text>
    <text x="580" y="588" font-size="12">監視とステータスページ付き。保持が最も短い</text>
    <text x="380" y="681" font-weight="600">アプリの外から URL を叩いて、落ちたら知らせたいなら、エラー監視ではなく死活監視</text>
    <text x="380" y="701" font-size="12">死活監視の無料枠比較が対象</text>
  </g>
