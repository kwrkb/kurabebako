<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14" fill="currentColor">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <!-- 質問（左列） -->
    <rect x="20" y="20" width="300" height="64" rx="8"/>
    <rect x="20" y="150" width="300" height="64" rx="8"/>
    <rect x="20" y="280" width="300" height="64" rx="8"/>
    <rect x="20" y="410" width="300" height="64" rx="8"/>
    <!-- 答え（右列） -->
    <rect x="420" y="20" width="320" height="64" rx="8" opacity="0.9"/>
    <rect x="420" y="150" width="320" height="64" rx="8" opacity="0.9"/>
    <rect x="420" y="280" width="320" height="64" rx="8" opacity="0.9"/>
    <rect x="420" y="410" width="320" height="64" rx="8" opacity="0.9"/>
    <rect x="20" y="530" width="720" height="50" rx="8" opacity="0.9"/>
    <!-- 矢印: はい（右へ） -->
    <line x1="320" y1="52" x2="418" y2="52" marker-end="url(#arrow)"/>
    <line x1="320" y1="182" x2="418" y2="182" marker-end="url(#arrow)"/>
    <line x1="320" y1="312" x2="418" y2="312" marker-end="url(#arrow)"/>
    <line x1="320" y1="442" x2="418" y2="442" marker-end="url(#arrow)"/>
    <!-- 矢印: いいえ（下へ） -->
    <line x1="170" y1="84" x2="170" y2="148" marker-end="url(#arrow)"/>
    <line x1="170" y1="214" x2="170" y2="278" marker-end="url(#arrow)"/>
    <line x1="170" y1="344" x2="170" y2="408" marker-end="url(#arrow)"/>
    <line x1="170" y1="474" x2="170" y2="528" marker-end="url(#arrow)"/>
  </g>
  <!-- 矢印のラベル -->
  <g font-size="12" opacity="0.75">
    <text x="360" y="46" text-anchor="middle">はい</text>
    <text x="360" y="176" text-anchor="middle">はい</text>
    <text x="360" y="306" text-anchor="middle">はい</text>
    <text x="360" y="436" text-anchor="middle">はい</text>
    <text x="182" y="120">いいえ</text>
    <text x="182" y="250">いいえ</text>
    <text x="182" y="380">いいえ</text>
    <text x="182" y="506">いいえ</text>
  </g>
  <!-- 質問の文言 -->
  <g text-anchor="middle">
    <text x="170" y="46">カード登録なしで、毎月戻る無料枠を</text>
    <text x="170" y="68">使い続けたい。まず 7 日で大きく試したい</text>
    <text x="170" y="176">LLM に渡す Markdown が欲しい。</text>
    <text x="170" y="198">1 ページ 1 クレジットで数えたい</text>
    <text x="170" y="306">一度きりの 1,000 クレジットで足りる。</text>
    <text x="170" y="328">JS 描画の有無で消費を切り替えたい</text>
    <text x="170" y="436">既成のスクレイパー（Actor）を借りて</text>
    <text x="170" y="458">動かしたい。取得数は使用量次第でよい</text>
  </g>
  <!-- 答えの文言 -->
  <g text-anchor="middle">
    <text x="580" y="46" font-weight="600">ScraperAPI</text>
    <text x="580" y="68" font-size="12">7 日で 5,000 ＋ 月 1,000。同時 5。JS 描画は +10</text>
    <text x="580" y="176" font-weight="600">Firecrawl</text>
    <text x="580" y="198" font-size="12">月 1,000 クレジット。同時 2、/scrape 10 req/分</text>
    <text x="580" y="306" font-weight="600">ScrapingBee</text>
    <text x="580" y="328" font-size="12">1,000 クレジット（一回きり）。JS なし 1 / あり 5</text>
    <text x="580" y="436" font-weight="600">Apify</text>
    <text x="580" y="458" font-size="12">月 USD 5 分の使用量。USD 0.2 / CU、同時実行 5</text>
    <text x="380" y="551" font-weight="600">月 USD 100 以上のコミットを前提に、サイト難度別の従量で大量に取るなら Zyte</text>
    <text x="380" y="571" font-size="12">無料枠は 30 日・USD 5 分の一回きり。課金は成功レスポンスのみ、HTTP 1,000 件 USD 0.13〜1.27</text>
  </g>
</svg>
