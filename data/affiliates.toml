# アフィリエイト案件の台帳。
#
# 本文に生のアフィリエイト URL を書かず、ここに登録した id を cta / ranking shortcode から
# 参照する。URL を1か所に寄せておくと、計測パラメータの変更や案件終了のたびに
# 記事を grep して回らずに済む。案件が終了したらエントリごと消す。参照している記事が
# ビルドエラーになるので、直し漏れが本番に出ない。
#
# id は英小文字・ハイフン区切り（記事から {{< cta "<id>" >}} で参照する）。
#
# [example-vps]
# name = 'Example VPS'            # 表示名（ボタンやランキングに出る）
# url = 'https://example.com/?a=' # アフィリエイトリンク（計測パラメータ込み）
# program = ''                    # 経由する ASP / プログラム名。管理用で表示しない
