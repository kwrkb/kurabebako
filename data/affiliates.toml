# ---- 各社の自社プログラム ----

# 参照リンクは fp_ref を付けた 4 種（トップ / pricing / documentation / signup）が配られている。
# 記事は無料枠を推す文脈なので cta には signup を使う。他 3 種は desk の affiliates/ に控えてある
[scraperapi]
name = 'ScraperAPI'
url = 'https://www.scraperapi.com/signup?fp_ref=ggko43'
program = 'ScraperAPI アフィリエイト（FirstPromoter 計測。2026-09-13 承認）'
