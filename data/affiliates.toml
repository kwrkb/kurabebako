# アフィリエイト案件の台帳。
#
# 本文に生のアフィリエイト URL を書かず、ここに登録した id を cta / ranking shortcode から
# 参照する。URL を1か所に寄せておくと、計測パラメータの変更や案件終了のたびに
# 記事を grep して回らずに済む。案件が終了したらエントリごと消す。参照している記事が
# ビルドエラーになるので、直し漏れが本番に出ない。
#
# id は英小文字・ハイフン区切り（記事から {{< cta "<id>" >}} で参照する）。
#
# [example-vps]
# name = 'Example VPS'            # 表示名（ボタンやランキングに出る）
# url = 'https://example.com/?a=' # アフィリエイトリンク（計測パラメータ込み）
# program = ''                    # 経由する ASP / プログラム名。管理用で表示しない
# text = '固定の文言'             # 任意。ASP の素材が「自由テキスト」でない場合、リンク文言は素材どおりに
#                                 # しか出せない（A8.net は自由テキスト以外の文言変更を禁止）。
#                                 # 指定すると cta の text 引数や既定の「〜の公式サイトを見る」より優先される
# pixel = 'https://.../0.gif?a8mat=' # 任意。ASP がリンクと対で配る 1x1 のインプレッション計測画像。
#                                 # 成果計測はリンク側で行われるが、配られたコードを崩さないために一緒に出す

# ---- A8.net（2026-09-12 提携）----
# a8mat はサイト kurabebako.com（websiteId=003）向けに発行したもの。主サイト用と混ぜない。

